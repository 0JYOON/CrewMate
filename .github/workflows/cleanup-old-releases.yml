name: Cleanup Old Releases

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete previous releases and their tags
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            const published = releases
              .filter((r) => !r.draft)
              .sort((a, b) => new Date(b.published_at || b.created_at) - new Date(a.published_at || a.created_at));

            const keepId = context.payload.release?.id || published[0]?.id;
            if (!keepId) {
              core.info('No published release found to keep.');
              return;
            }

            for (const rel of published) {
              if (rel.id === keepId) {
                core.info(`Keeping latest release: ${rel.tag_name} (id=${rel.id})`);
                continue;
              }
              core.info(`Deleting old release: ${rel.tag_name} (id=${rel.id})`);
              await github.rest.repos.deleteRelease({ owner, repo, release_id: rel.id });
              if (rel.tag_name) {
                try {
                  await github.rest.git.deleteRef({ owner, repo, ref: `tags/${rel.tag_name}` });
                  core.info(`Deleted old tag: ${rel.tag_name}`);
                } catch (err) {
                  core.warning(`Could not delete tag ${rel.tag_name}: ${err.message}`);
                }
              }
            }
